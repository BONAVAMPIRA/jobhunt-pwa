<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cockpit — Chat</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#7eb8f7">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #1a1a2e;
    color: #e0e0e0;
    font-family: system-ui, sans-serif;
    font-size: 14px;
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  .header {
    padding: 10px 14px;
    border-bottom: 1px solid #2d3748;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .header h1 { font-size: 15px; flex: 1; }
  .header h1.claude-title { color: #7eb8f7; }
  .header h1.hermes-title { color: #34d399; }

  .toggle {
    display: flex;
    background: #0f172a;
    border-radius: 20px;
    padding: 3px;
    border: 1px solid #2d3748;
  }
  .toggle button {
    padding: 4px 12px;
    border: none;
    border-radius: 16px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    background: transparent;
    color: #6b7280;
    transition: all 0.15s;
  }
  .toggle button.active-claude { background: #2563eb; color: #fff; }
  .toggle button.active-hermes { background: #059669; color: #fff; }

  /* Threads — chacun stocke son propre historique */
  .thread {
    flex: 1;
    overflow-y: auto;
    padding: 12px 14px;
    display: none;
    flex-direction: column;
    gap: 10px;
  }
  .thread.visible { display: flex; }

  .msg {
    max-width: 85%;
    padding: 10px 12px;
    border-radius: 12px;
    line-height: 1.5;
    font-size: 13px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user    { align-self: flex-end; background: #2563eb; color: #fff; border-bottom-right-radius: 4px; }
  .msg.claude  { align-self: flex-start; background: #16213e; border: 1px solid #374151; border-bottom-left-radius: 4px; }
  .msg.hermes  { align-self: flex-start; background: #16213e; border: 1px solid #065f46; border-bottom-left-radius: 4px; }
  .msg.system  { align-self: center; color: #6b7280; font-size: 11px; font-style: italic; background: none; padding: 2px 0; }

  .sender-label {
    font-size: 9px;
    font-weight: 800;
    letter-spacing: 0.08em;
    margin-bottom: 3px;
    opacity: 0.55;
  }
  .label-claude { color: #7eb8f7; }
  .label-hermes { color: #34d399; }

  /* Countdown Hermes */
  .hermes-waiting {
    align-self: flex-start;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .hermes-bubble-wait {
    background: #16213e;
    border: 1px solid #065f46;
    border-radius: 12px;
    border-bottom-left-radius: 4px;
    padding: 8px 14px;
    font-size: 12px;
    color: #6b7280;
    font-style: italic;
  }
  .countdown-ring {
    position: relative;
    width: 36px;
    height: 36px;
    flex-shrink: 0;
  }
  .countdown-ring svg { transform: rotate(-90deg); }
  .countdown-ring.spinning svg { animation: ring-spin 0.9s linear infinite; transform-origin: 50% 50%; }
  @keyframes ring-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .countdown-ring circle {
    fill: none;
    stroke: #065f46;
    stroke-width: 3;
    stroke-linecap: round;
    transition: stroke-dashoffset 1s linear;
  }
  .countdown-ring circle.track { stroke: #1f2937; }
  .countdown-num {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    color: #34d399;
  }

  .cursor {
    display: inline-block;
    width: 2px; height: 13px;
    background: #7eb8f7;
    animation: blink 1s step-end infinite;
    vertical-align: text-bottom;
    margin-left: 1px;
  }
  .hermes-mode .cursor { background: #34d399; }
  @keyframes blink { 50% { opacity: 0; } }

  /* Relay Hermes */
  .hermes-relay {
    align-self: flex-start;
    margin-top: 6px;
    background: #064e3b;
    border: 1px solid #059669;
    border-radius: 10px;
    padding: 10px 12px;
    max-width: 85%;
  }
  .relay-label {
    font-size: 10px;
    font-weight: 800;
    color: #34d399;
    letter-spacing: 0.08em;
    margin-bottom: 5px;
  }
  .relay-task {
    font-size: 12px;
    color: #d1fae5;
    margin-bottom: 8px;
    line-height: 1.4;
  }
  .relay-btn {
    background: #059669;
    border: none;
    border-radius: 6px;
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    padding: 6px 14px;
    cursor: pointer;
    width: 100%;
  }
  .relay-btn:active { opacity: 0.8; }

  /* Boucle retour vers Claude (depuis une réponse Hermes) */
  .claude-relay {
    align-self: flex-start;
    margin-top: 6px;
    background: #0b2546;
    border: 1px solid #2563eb;
    border-radius: 10px;
    padding: 10px 12px;
    max-width: 85%;
  }
  .relay-label-c {
    font-size: 10px; font-weight: 800;
    color: #7eb8f7; letter-spacing: 0.08em; margin-bottom: 7px;
  }
  .relay-btn-c {
    background: #2563eb; border: none; border-radius: 6px;
    color: #fff; font-size: 12px; font-weight: 700;
    padding: 6px 14px; cursor: pointer; width: 100%;
  }
  .relay-btn-c:active { opacity: 0.8; }
  .relay-btn-c:disabled { background: #374151; cursor: default; }

  /* Puces d'action rapide (mode Claude) */
  .quick-actions {
    display: flex; flex-wrap: wrap; gap: 6px;
    padding: 0 14px 4px;
    flex-shrink: 0;
  }
  .quick-actions.hidden { display: none; }
  .chip {
    background: #16213e; border: 1px solid #2d3748;
    color: #cfe3ff; border-radius: 16px;
    font-size: 11px; font-weight: 600;
    padding: 5px 12px; cursor: pointer;
  }
  .chip:active { background: #1e293b; }

  /* Garde-fou budget : barre de coût */
  .cost-bar {
    flex-shrink: 0;
    font-size: 10px;
    padding: 3px 14px;
    color: #6b7280;
    background: #0f172a;
    border-bottom: 1px solid #1f2937;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .cost-bar.warn { color: #fbbf24; }
  .cost-bar.danger { color: #f87171; font-weight: 700; }
  .cost-bar .reset {
    margin-left: auto;
    color: #6b7280;
    text-decoration: underline;
    cursor: pointer;
    background: none; border: none; font-size: 10px; padding: 0;
  }

  .input-bar {
    padding: 10px 12px;
    border-top: 1px solid #2d3748;
    display: flex;
    gap: 8px;
    align-items: flex-end;
    flex-shrink: 0;
  }
  #msg-input {
    flex: 1;
    background: #16213e;
    border: 1px solid #2d3748;
    border-radius: 20px;
    color: #e0e0e0;
    padding: 9px 14px;
    font-size: 13px;
    font-family: inherit;
    resize: none;
    max-height: 120px;
    line-height: 1.4;
    outline: none;
  }
  #msg-input:focus { border-color: #7eb8f7; }
  #msg-input.hermes-focus:focus { border-color: #059669; }

  #send-btn {
    width: 38px; height: 38px;
    border: none; border-radius: 50%;
    color: #fff; font-size: 18px;
    cursor: pointer; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s;
  }
  #send-btn.mode-claude { background: #2563eb; }
  #send-btn.mode-hermes { background: #059669; }
  #send-btn:disabled { background: #374151 !important; cursor: not-allowed; }

  .nav {
    display: flex;
    border-top: 1px solid #2d3748;
    flex-shrink: 0;
    background: #16213e;
  }
  .nav a {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; padding: 8px 4px;
    text-decoration: none; font-size: 10px; color: #6b7280; gap: 3px;
  }
  .nav a.active { color: #7eb8f7; }
  .nav a span { font-size: 20px; }

  /* Rendu Markdown (appliqué une fois la réponse complète) */
  .msg.md { white-space: normal; }
  .msg.md > *:first-child { margin-top: 0; }
  .msg.md > *:last-child { margin-bottom: 0; }
  .msg.md p { margin: 0 0 8px; }
  .msg.md h1, .msg.md h2, .msg.md h3,
  .msg.md h4, .msg.md h5, .msg.md h6 {
    margin: 12px 0 6px; line-height: 1.25; color: #cfe3ff;
  }
  .msg.md h1 { font-size: 17px; }
  .msg.md h2 { font-size: 15px; }
  .msg.md h3 { font-size: 14px; }
  .msg.md h4, .msg.md h5, .msg.md h6 { font-size: 13px; }
  .msg.md ul, .msg.md ol { margin: 4px 0 8px; padding-left: 20px; }
  .msg.md li { margin: 2px 0; }
  .msg.md a { color: #7eb8f7; text-decoration: underline; }
  .msg.md strong { font-weight: 700; color: #fff; }
  .msg.md em { font-style: italic; }
  .msg.md code {
    background: #0f172a; border: 1px solid #2d3748;
    border-radius: 4px; padding: 1px 5px;
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    font-size: 12px;
  }
  .msg.md pre {
    background: #0f172a; border: 1px solid #2d3748;
    border-radius: 8px; padding: 10px 12px;
    overflow-x: auto; margin: 6px 0;
  }
  .msg.md pre code { background: none; border: none; padding: 0; }
  .msg.md blockquote {
    border-left: 3px solid #374151; margin: 6px 0;
    padding: 2px 0 2px 10px; color: #9ca3af;
  }
  .msg.md hr { border: none; border-top: 1px solid #2d3748; margin: 10px 0; }
  .msg.md table {
    border-collapse: collapse; margin: 6px 0; width: 100%;
    font-size: 12px; display: block; overflow-x: auto;
  }
  .msg.md th, .msg.md td {
    border: 1px solid #2d3748; padding: 5px 8px; text-align: left;
  }
  .msg.md th { background: #0f172a; color: #cfe3ff; font-weight: 700; }
</style>
</head>
<body>

<div class="header">
  <h1 id="header-title" class="claude-title">Claude</h1>
  <div class="toggle">
    <button id="btn-claude" onclick="setMode('claude')">Claude</button>
    <button id="btn-hermes" onclick="setMode('hermes')">Hermes</button>
  </div>
</div>

<div id="cost-bar" class="cost-bar"></div>

<!-- Fil Claude (séparé) -->
<div id="thread-claude" class="thread visible">
  <div class="msg system">Claude Sonnet — même contexte que le CLI. Continue le projet depuis ton téléphone.</div>
</div>

<!-- Fil Hermes (séparé) -->
<div id="thread-hermes" class="thread">
  <div class="msg system">Hermes Agent — exécute tes tâches sur le VPS. La réponse arrive dès qu'il a fini.</div>
</div>

<div id="quick-actions" class="quick-actions">
  <button class="chip" onclick="readHermesIdeas()">📋 Idées d'Hermes</button>
  <button class="chip" onclick="askProjectState()">📍 Où on en est ?</button>
</div>

<div class="input-bar">
  <textarea id="msg-input" rows="1" placeholder="Écris un message..."></textarea>
  <button id="send-btn" class="mode-claude">➤</button>
</div>

<nav class="nav">
  <a href="/chat.html" class="active"><span>💬</span>Chat</a>
  <a href="/scoring.html"><span>📋</span>Scoring</a>
  <a href="/suivi.html"><span>📮</span>Suivi</a>
  <a href="/systeme.html"><span>⚙️</span>Système</a>
</nav>

<script>
let mode = localStorage.getItem('chat_mode') || 'claude';

// Historiques séparés
const histories = {
  claude: JSON.parse(sessionStorage.getItem('history_claude') || '[]'),
  hermes: { session_id: sessionStorage.getItem('hermes_session') || null }
};

const input = document.getElementById('msg-input');
const sendBtn = document.getElementById('send-btn');
const threadClaude = document.getElementById('thread-claude');
const threadHermes = document.getElementById('thread-hermes');

function currentThread() {
  return mode === 'claude' ? threadClaude : threadHermes;
}

/* ── Garde-fou budget ─────────────────────────────────────────
   Le mode Claude consomme des crédits (Sonnet 4.6). Le mode Hermes
   est gratuit. On cumule le coût de la session et on alerte. */
const costBar = document.getElementById('cost-bar');
let sessionCost = parseFloat(sessionStorage.getItem('chat_cost') || '0');
let lastMsgCost = 0;
const COST_WARN = 0.50, COST_DANGER = 1.00;  // $ USD
let warnedDanger = false;

function fmtUSD(n) {
  if (n < 0.01) return n.toFixed(3).replace('.', ',') + ' $';
  return n.toFixed(2).replace('.', ',') + ' $';
}
function recordCost(cost) {
  if (typeof cost !== 'number' || !isFinite(cost)) return;
  lastMsgCost = cost;
  sessionCost += cost;
  sessionStorage.setItem('chat_cost', String(sessionCost));
  updateCostBar();
  if (sessionCost >= COST_DANGER && !warnedDanger) {
    warnedDanger = true;
    addMsg(threadClaude, `⚠️ Budget : ${fmtUSD(sessionCost)} dépensés dans cette session. Pense à passer en mode Hermes (gratuit) pour les tâches simples.`, 'system');
  }
}
function updateCostBar() {
  if (mode === 'hermes') {
    costBar.className = 'cost-bar';
    costBar.innerHTML = '🟢 Hermes — gratuit (0 $)';
    return;
  }
  let cls = 'cost-bar';
  if (sessionCost >= COST_DANGER) cls += ' danger';
  else if (sessionCost >= COST_WARN) cls += ' warn';
  costBar.className = cls;
  const last = lastMsgCost ? ` · dernier ${fmtUSD(lastMsgCost)}` : '';
  costBar.innerHTML = `💰 Session ≈ ${fmtUSD(sessionCost)}${last}`
    + `<button class="reset" onclick="resetCost()">remettre à zéro</button>`;
}
function resetCost() {
  sessionCost = 0; lastMsgCost = 0; warnedDanger = false;
  sessionStorage.setItem('chat_cost', '0');
  updateCostBar();
}

/* ── Mini-renderer Markdown (sans dépendance, offline-safe) ── */
function escHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function splitRow(row) {
  return row.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|').map(c => c.trim());
}
function mdInline(s) {
  const codes = [];
  s = s.replace(/`([^`]+)`/g, (m, c) => { codes.push(c); return '' + (codes.length - 1) + ''; });
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/__([^_]+)__/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*])\*([^*\s][^*]*?)\*/g, '$1<em>$2</em>');
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/(\d+)/g, (m, n) => '<code>' + codes[+n] + '</code>');
  return s;
}
function renderMarkdown(src) {
  if (!src) return '';
  const blocks = [];
  let text = src.replace(/```(\w+)?\n?([\s\S]*?)```/g, (m, lang, code) => {
    blocks.push('<pre><code>' + escHtml(code.replace(/\n$/, '')) + '</code></pre>');
    return '␀CB' + (blocks.length - 1) + '␀';
  });
  text = escHtml(text);
  const lines = text.split('\n');
  const out = [];
  let i = 0;
  const isBlockStart = l =>
    /^\s*(#{1,6}\s|[-*+]\s|\d+\.\s|>|---|\*\*\*|___)/.test(l) ||
    /^␀CB\d+␀$/.test(l.trim());
  while (i < lines.length) {
    const line = lines[i];
    if (/^␀CB\d+␀$/.test(line.trim())) { out.push(line.trim()); i++; continue; }
    if (/^\s*(---|\*\*\*|___)\s*$/.test(line)) { out.push('<hr>'); i++; continue; }
    const h = line.match(/^\s*(#{1,6})\s+(.*)$/);
    if (h) { const lvl = h[1].length; out.push(`<h${lvl}>${mdInline(h[2])}</h${lvl}>`); i++; continue; }
    if (line.includes('|') && i + 1 < lines.length &&
        /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i + 1]) && lines[i + 1].includes('-')) {
      const header = splitRow(line);
      i += 2;
      const rows = [];
      while (i < lines.length && lines[i].includes('|') && lines[i].trim() !== '') { rows.push(splitRow(lines[i])); i++; }
      let t = '<table><thead><tr>' + header.map(c => `<th>${mdInline(c)}</th>`).join('') + '</tr></thead><tbody>';
      for (const r of rows) t += '<tr>' + r.map(c => `<td>${mdInline(c)}</td>`).join('') + '</tr>';
      out.push(t + '</tbody></table>'); continue;
    }
    if (/^\s*[-*+]\s+/.test(line)) {
      const items = [];
      while (i < lines.length && /^\s*[-*+]\s+/.test(lines[i])) { items.push('<li>' + mdInline(lines[i].replace(/^\s*[-*+]\s+/, '')) + '</li>'); i++; }
      out.push('<ul>' + items.join('') + '</ul>'); continue;
    }
    if (/^\s*\d+\.\s+/.test(line)) {
      const items = [];
      while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) { items.push('<li>' + mdInline(lines[i].replace(/^\s*\d+\.\s+/, '')) + '</li>'); i++; }
      out.push('<ol>' + items.join('') + '</ol>'); continue;
    }
    if (/^\s*>\s?/.test(line)) {
      const buf = [];
      while (i < lines.length && /^\s*>\s?/.test(lines[i])) { buf.push(lines[i].replace(/^\s*>\s?/, '')); i++; }
      out.push('<blockquote>' + mdInline(buf.join(' ')) + '</blockquote>'); continue;
    }
    if (line.trim() === '') { i++; continue; }
    const buf = [line]; i++;
    while (i < lines.length && lines[i].trim() !== '' && !isBlockStart(lines[i])) { buf.push(lines[i]); i++; }
    out.push('<p>' + mdInline(buf.join('<br>')) + '</p>');
  }
  let html = out.join('');
  html = html.replace(/␀CB(\d+)␀/g, (m, n) => blocks[+n]);
  return html;
}

function setMode(m) {
  mode = m;
  localStorage.setItem('chat_mode', m);

  const isClaude = m === 'claude';
  document.getElementById('header-title').textContent = isClaude ? 'Claude' : 'Hermes';
  document.getElementById('header-title').className = isClaude ? 'claude-title' : 'hermes-title';
  document.getElementById('btn-claude').className = isClaude ? 'active-claude' : '';
  document.getElementById('btn-hermes').className = !isClaude ? 'active-hermes' : '';
  sendBtn.className = `mode-${m}`;
  input.className = !isClaude ? 'hermes-focus' : '';
  input.placeholder = isClaude ? 'Demande-moi quelque chose...' : 'Parle à Hermes...';

  threadClaude.classList.toggle('visible', isClaude);
  threadHermes.classList.toggle('visible', !isClaude);
  document.getElementById('quick-actions').classList.toggle('hidden', !isClaude);
  updateCostBar();
  currentThread().scrollTop = currentThread().scrollHeight;
}

function addMsg(thread, text, cls) {
  const el = document.createElement('div');
  el.className = `msg ${cls}`;
  el.textContent = text;
  thread.appendChild(el);
  thread.scrollTop = thread.scrollHeight;
  return el;
}

function addLabeledMsg(thread, cls, labelText, labelCls) {
  const wrap = document.createElement('div');
  const label = document.createElement('div');
  label.className = `sender-label ${labelCls}`;
  label.textContent = labelText;
  const bubble = document.createElement('div');
  bubble.className = `msg ${cls}`;
  wrap.appendChild(label);
  wrap.appendChild(bubble);
  thread.appendChild(wrap);
  thread.scrollTop = thread.scrollHeight;
  return bubble;
}

// Countdown Hermes
function addHermesWaiting(thread) {
  const wrap = document.createElement('div');
  wrap.className = 'hermes-waiting';
  wrap.id = 'hermes-wait';

  const r = 15, circ = 2 * Math.PI * r;
  wrap.innerHTML = `
    <div class="hermes-bubble-wait" id="wait-text">Hermes travaille…</div>
    <div class="countdown-ring spinning">
      <svg width="36" height="36" viewBox="0 0 36 36">
        <circle class="track" cx="18" cy="18" r="${r}" stroke-dasharray="${circ}" stroke-dashoffset="0"/>
        <circle id="ring-fill" cx="18" cy="18" r="${r}"
          stroke="#34d399"
          stroke-dasharray="${circ * 0.28} ${circ}"
          stroke-dashoffset="0"/>
      </svg>
      <div class="countdown-num" id="ring-num">0s</div>
    </div>`;

  thread.appendChild(wrap);
  thread.scrollTop = thread.scrollHeight;

  let secs = 0;
  const num = wrap.querySelector('#ring-num');
  // Compteur de temps écoulé (monte). Pas de budget fixe : la bulle disparaît
  // dès qu'Hermes répond (clearInterval + wrap.remove dans sendHermes).
  const timer = setInterval(() => {
    secs++;
    num.textContent = secs + 's';
  }, 1000);

  return { wrap, timer };
}

async function sendClaude(text, displayNote) {
  // displayNote : si fourni, on affiche une note système courte au lieu du
  // message brut (utile pour réinjecter un gros résultat Hermes proprement).
  if (displayNote) addMsg(threadClaude, displayNote, 'system');
  else addMsg(threadClaude, text, 'user');
  const bubble = addLabeledMsg(threadClaude, 'claude', 'CLAUDE', 'label-claude');
  const cursor = document.createElement('span');
  cursor.className = 'cursor';
  bubble.appendChild(cursor);

  let fullText = '';
  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, history: histories.claude, mode: 'claude' }),
    });

    if (!res.ok || !res.body) throw new Error('Erreur serveur');

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const data = line.slice(6);
        if (data === '[DONE]') continue;
        try {
          const evt = JSON.parse(data);
          if (evt.token) {
            fullText += evt.token;
            bubble.textContent = fullText;
            bubble.appendChild(cursor);
            threadClaude.scrollTop = threadClaude.scrollHeight;
          } else if (typeof evt.cost === 'number') {
            recordCost(evt.cost);
          }
        } catch (_) {}
      }
    }
    cursor.remove();

    // Détecter les tags [HERMES: tâche]. Claude insère parfois des tags d'EXEMPLE
    // en expliquant le mécanisme (« description précise… », « tâche précise »).
    // On retire TOUS les tags de l'affichage (même en code inline `...`), on ignore
    // les gabarits, et on ne relaie QUE la dernière vraie tâche (la consigne dit
    // « ajoute à la fin »). Évite la boucle : un exemple cité n'est plus relayé.
    let displayText = fullText.replace(/`?\[HERMES:[\s\S]+?\]`?/g, '').trim();
    const allTasks = [...fullText.matchAll(/\[HERMES:\s*([\s\S]+?)\]/g)].map(m => m[1].trim());
    const isPlaceholder = t => {
      const n = t.toLowerCase().replace(/[\s.…]+$/, '');
      return n.length < 12 || n === 'tâche' || n === 'tâche précise'
        || n.startsWith('description précise') || n.startsWith('tâche mécanique')
        || n.startsWith('tâche à exécuter');
    };
    const realTasks = allTasks.filter(t => t && !isPlaceholder(t));
    const task = realTasks.length ? realTasks[realTasks.length - 1] : null;
    if (task) {
      // Ajouter le bloc relay (addEventListener + textContent : pas d'injection
      // via attribut onclick — les guillemets d'une tâche cassaient l'attribut).
      const relay = document.createElement('div');
      relay.className = 'hermes-relay';
      const rLabel = document.createElement('div');
      rLabel.className = 'relay-label';
      rLabel.textContent = '⚡ TÂCHE À EXÉCUTER SUR LE VPS (via Hermes)';
      const rTask = document.createElement('div');
      rTask.className = 'relay-task';
      rTask.textContent = task;
      const rBtn = document.createElement('button');
      rBtn.className = 'relay-btn';
      rBtn.textContent = '📤 Envoyer cette tâche à Hermes';
      rBtn.addEventListener('click', () => sendToHermes(task, rBtn));
      relay.append(rLabel, rTask, rBtn);
      threadClaude.appendChild(relay);
      threadClaude.scrollTop = threadClaude.scrollHeight;
    }

    // Rendu Markdown propre une fois la réponse complète
    bubble.classList.add('md');
    bubble.innerHTML = renderMarkdown(displayText);
    threadClaude.scrollTop = threadClaude.scrollHeight;

    histories.claude.push({ role: 'user', content: text });
    histories.claude.push({ role: 'assistant', content: fullText });
    if (histories.claude.length > 30) histories.claude.splice(0, 2);
    sessionStorage.setItem('history_claude', JSON.stringify(histories.claude));
  } catch (e) {
    cursor.remove();
    bubble.textContent = 'Erreur : ' + e.message;
  }
}

async function sendToHermes(task, btn) {
  btn.disabled = true;
  btn.textContent = '📤 Envoyé à Hermes ✓';
  // Trace dans le fil Claude ce qui part (continuité), puis bascule sur Hermes.
  addMsg(threadClaude, '📤 Tâche transmise à Hermes : ' + task, 'system');
  setMode('hermes');
  await sendHermes(task);
}

async function sendHermes(text) {
  addMsg(threadHermes, text, 'user');
  const { wrap, timer } = addHermesWaiting(threadHermes);

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, session_id: histories.hermes.session_id, mode: 'hermes' }),
    });
    const data = await res.json();
    clearInterval(timer);
    wrap.remove();

    if (data.session_id) {
      histories.hermes.session_id = data.session_id;
      sessionStorage.setItem('hermes_session', data.session_id);
    }

    const result = data.response || 'Pas de réponse.';
    const bubble = addLabeledMsg(threadHermes, 'hermes', 'HERMES', 'label-hermes');
    bubble.classList.add('md');
    bubble.innerHTML = renderMarkdown(result);

    // Boucle retour : Claude (cerveau) peut analyser ce résultat
    const back = document.createElement('div');
    back.className = 'claude-relay';
    back.innerHTML = `
      <div class="relay-label-c">↩ BOUCLER VERS CLAUDE</div>
      <button class="relay-btn-c">Analyser ce résultat avec Claude ➤</button>`;
    back.querySelector('button').addEventListener('click', (e) => relayToClaude(text, result, e.target));
    threadHermes.appendChild(back);
    threadHermes.scrollTop = threadHermes.scrollHeight;
  } catch (e) {
    clearInterval(timer);
    wrap.remove();
    addMsg(threadHermes, 'Hermes inaccessible. Essaie le mode Claude.', 'system');
  }
}

// Réinjecte le résultat d'Hermes dans le cerveau (Claude) pour qu'il enchaîne.
async function relayToClaude(task, result, btn) {
  if (btn) { btn.disabled = true; btn.textContent = 'Transmis à Claude ✓'; }
  setMode('claude');
  const payload =
    `Hermes (les mains sur le VPS) a exécuté cette tâche :\n« ${task} »\n\n` +
    `Résultat obtenu :\n${result}\n\n` +
    `Analyse ce résultat et dis-moi la prochaine étape. ` +
    `Si une nouvelle action VPS est nécessaire, émets un nouveau tag [HERMES: ...].`;
  sendBtn.disabled = true;
  await sendClaude(payload, '↩ Résultat d\'Hermes transmis à Claude');
  sendBtn.disabled = false;
}

// Puce : faire lire et résumer les suggestions d'amélioration d'Hermes.
async function readHermesIdeas() {
  setMode('claude');
  sendBtn.disabled = true;
  await sendClaude(
    'Demande à Hermes de lire ses propres suggestions d\'amélioration ' +
    '(fichier agents/memory/suggestions.md) et de me les résumer, ' +
    'puis aide-moi à décider lesquelles valent la peine d\'être actionnées.'
  );
  sendBtn.disabled = false;
}

// Puce : état réel du projet (le contexte temps réel est injecté côté serveur).
async function askProjectState() {
  setMode('claude');
  sendBtn.disabled = true;
  await sendClaude('Où en est le projet exactement, et quelle est la prochaine étape prioritaire ?');
  sendBtn.disabled = false;
}

async function send() {
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  input.style.height = 'auto';
  sendBtn.disabled = true;

  if (mode === 'claude') await sendClaude(text);
  else await sendHermes(text);

  sendBtn.disabled = false;
  input.focus();
}

sendBtn.addEventListener('click', send);
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
});

setMode(mode);
if ('serviceWorker' in navigator) {
  let __swReloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (__swReloading) return; __swReloading = true; location.reload(); });
  navigator.serviceWorker.register('/sw.js').then(r => r.update && r.update()).catch(() => {});
}
</script>
