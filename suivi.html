<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cockpit — Suivi</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#7eb8f7">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background:#1a1a2e; color:#e0e0e0; font-family:system-ui,sans-serif; font-size:14px; height:100dvh; display:flex; flex-direction:column; }
  .header { padding:10px 16px; border-bottom:1px solid #2d3748; display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
  .header h1 { font-size:15px; color:#7eb8f7; }
  .count-badge { background:#2563eb; color:#fff; font-size:11px; font-weight:700; padding:2px 8px; border-radius:12px; }
  .searchbar { padding:8px 14px; flex-shrink:0; border-bottom:1px solid #1f2937; }
  #search { width:100%; background:#16213e; border:1px solid #2d3748; border-radius:8px; color:#e0e0e0; padding:8px 12px; font-size:13px; outline:none; }
  #search:focus { border-color:#7eb8f7; }
  #list { flex:1; overflow-y:auto; padding:12px 14px; display:flex; flex-direction:column; gap:12px; }
  #list > * { flex-shrink:0; }
  .card { background:#16213e; border:1px solid #2d3748; border-radius:14px; padding:14px; }
  .card-top { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:6px; }
  .badge { font-size:10px; font-weight:800; padding:2px 8px; border-radius:8px; letter-spacing:.04em; }
  .b-postule  { background:#064e3b; color:#6ee7b7; }
  .b-entrevue { background:#7c2d12; color:#fdba74; }
  .b-offre    { background:#1e3a8a; color:#93c5fd; }
  .b-refuse   { background:#3f1d1d; color:#fca5a5; }
  .b-autre    { background:#1f2937; color:#9ca3af; }
  .score { font-size:11px; color:#9ca3af; margin-left:auto; }
  .card-title { font-size:14px; font-weight:700; line-height:1.3; }
  .card-company { font-size:12px; color:#7eb8f7; margin-bottom:8px; }
  .sal { background:#0f1d17; border:1px solid #065f46; border-radius:10px; padding:8px 10px; margin:8px 0; }
  .sal-l { font-size:10px; font-weight:800; color:#34d399; letter-spacing:.06em; margin-bottom:3px; }
  .sal-v { font-size:13px; color:#d1fae5; }
  .sal-v b { color:#fff; font-size:15px; }
  .sal-none { font-size:11px; color:#6b7280; font-style:italic; }
  .meta { font-size:11px; color:#6b7280; margin-bottom:10px; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; }
  .btn { border:0; border-radius:8px; font-size:12px; font-weight:700; padding:8px 12px; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; }
  .btn-open { background:#1f2937; color:#cfe3ff; }
  .btn-dl   { background:#1d4ed8; color:#fff; }
  .btn-dl:disabled { opacity:.6; }
  .info-card { background:#16213e; border:1px dashed #2d3748; border-radius:12px; padding:20px; text-align:center; color:#6b7280; font-size:13px; line-height:1.6; }
  .info-card .icon { font-size:36px; display:block; margin-bottom:8px; }
  .fsnote { font-size:10px; color:#6b7280; padding:0 14px 6px; flex-shrink:0; }
  .nav { display:flex; border-top:1px solid #2d3748; flex-shrink:0; background:#16213e; }
  .nav a { flex:1; display:flex; flex-direction:column; align-items:center; padding:8px 4px; text-decoration:none; font-size:10px; color:#6b7280; gap:3px; }
  .nav a.active { color:#7eb8f7; }
  .nav a span { font-size:20px; }
  .toast { position:fixed; left:50%; transform:translateX(-50%); bottom:70px; background:#0f172a; border:1px solid #2d3748; color:#e0e0e0; font-size:12px; padding:8px 14px; border-radius:8px; opacity:0; transition:opacity .2s; pointer-events:none; max-width:90%; }
  .toast.show { opacity:1; }
  .toast.warn { border-color:#f59e0b; color:#fcd34d; }
</style>
</head>
<body>

<div class="header">
  <h1>Suivi <span style="font-size:9px;color:#4b5563;font-weight:400;">build v1</span></h1>
  <span class="count-badge" id="count">—</span>
</div>
<div class="searchbar"><input id="search" type="search" placeholder="Rechercher une entreprise, un poste…"></div>
<div id="fsnote" class="fsnote"></div>

<div id="list"><div class="info-card" id="boot">⏳ Chargement…</div></div>

<nav class="nav">
  <a href="/chat.html"><span>💬</span>Chat</a>
  <a href="/scoring.html"><span>📋</span>Scoring</a>
  <a href="/suivi.html" class="active"><span>📮</span>Suivi</a>
  <a href="/systeme.html"><span>⚙️</span>Système</a>
</nav>

<div class="toast" id="toast"></div>

<script>
let jobs = [], q = "";
const esc = s => (s == null ? "" : String(s)).replace(/[&<>]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;" }[c]));
const FS_OK = typeof window.showDirectoryPicker === "function";

let toastT;
function toast(msg, warn) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.className = "show" + (warn ? " warn" : "");
  clearTimeout(toastT); toastT = setTimeout(() => { t.className = ""; }, 3000);
}

function badgeClass(s) {
  return { postule:"b-postule","postulé":"b-postule", entrevue:"b-entrevue", offre:"b-offre", refuse:"b-refuse","refusé":"b-refuse" }[s] || "b-autre";
}
function badgeLabel(s) {
  return { postule:"POSTULÉ","postulé":"POSTULÉ", entrevue:"ENTREVUE", offre:"OFFRE", refuse:"REFUSÉ","refusé":"REFUSÉ" }[s] || (s || "—").toUpperCase();
}

function salBlock(j) {
  if (j.salaire_cible || j.salaire_plancher) {
    return `<div class="sal"><div class="sal-l">💰 PRÉTENTION SALARIALE</div>` +
      `<div class="sal-v">Cible : <b>${esc(j.salaire_cible || "—")}</b>` +
      (j.salaire_plancher ? ` · Plancher : ${esc(j.salaire_plancher)}` : "") + `</div></div>`;
  }
  return `<div class="sal sal-none">Analyse salariale non disponible pour cette offre.</div>`;
}

function card(j) {
  const link = j.url ? `<a class="btn btn-open" href="${esc(j.url)}" target="_blank" rel="noopener">↗ Offre</a>` : "";
  return `<div class="card" data-id="${esc(j.job_id)}">
    <div class="card-top">
      <span class="badge ${badgeClass(j.statut)}">${esc(badgeLabel(j.statut))}</span>
      ${j.score ? `<span class="score">score ${j.score}</span>` : ""}
    </div>
    <div class="card-title">${esc(j.poste || "—")}</div>
    <div class="card-company">${esc(j.entreprise || "")}</div>
    ${salBlock(j)}
    ${j.date ? `<div class="meta">Candidature : ${esc(j.date)}</div>` : ""}
    <div class="actions">
      ${link}
      <button class="btn btn-dl" data-dl="${esc(j.job_id)}">⬇ Dossier</button>
    </div>
  </div>`;
}

function render() {
  const list = document.getElementById("list");
  const ql = q.trim().toLowerCase();
  const shown = jobs.filter(j => !ql || (`${j.entreprise} ${j.poste}`).toLowerCase().includes(ql));
  document.getElementById("count").textContent = shown.length;
  if (!jobs.length) {
    list.innerHTML = `<div class="info-card"><span class="icon">📮</span><strong>Aucune candidature suivie</strong><br><br>
      Les offres au statut <b>postulé</b> apparaîtront ici.<br>Marque une offre « ✅ J'ai postulé » dans le copilote.</div>`;
    return;
  }
  if (!shown.length) { list.innerHTML = `<div class="info-card">Aucun résultat pour « ${esc(q)} ».</div>`; return; }
  list.innerHTML = shown.map(card).join("");
}

async function load() {
  try {
    const res = await fetch("/api/suivi", { cache: "no-store" });
    const d = await res.json();
    if (d.error) throw new Error(d.error);
    jobs = d.jobs || [];
  } catch (e) { jobs = []; toast("Suivi indisponible : " + (e.message || e), true); }
  render();
}

// ── Téléchargement du dossier : File System Access (écrit dans Focus FindJob) ──
const safeName = s => String(s || "").replace(/[\\\/:*?"<>|]+/g, " ").replace(/\s+/g, " ").trim() || "Sans nom";
const monthFolder = () => new Date().toISOString().slice(0, 7).replace("-", ""); // AAAAMM

function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open("jobhunt", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("kv");
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function idbGet(k) { const db = await idb(); return new Promise(res => { const t = db.transaction("kv").objectStore("kv").get(k); t.onsuccess = () => res(t.result); t.onerror = () => res(null); }); }
async function idbSet(k, v) { const db = await idb(); return new Promise(res => { const t = db.transaction("kv", "readwrite").objectStore("kv").put(v, k); t.onsuccess = () => res(); t.onerror = () => res(); }); }

let rootHandle = null;
async function verifyPerm(h) {
  try {
    if ((await h.queryPermission({ mode: "readwrite" })) === "granted") return true;
    return (await h.requestPermission({ mode: "readwrite" })) === "granted";
  } catch { return false; }
}
async function getRoot() {
  if (rootHandle && await verifyPerm(rootHandle)) return rootHandle;
  const stored = await idbGet("root");
  if (stored && await verifyPerm(stored)) { rootHandle = stored; return rootHandle; }
  const h = await window.showDirectoryPicker({ id: "focusfindjob", mode: "readwrite" });
  await idbSet("root", h); rootHandle = h; return h;
}
async function ensureDir(root, parts) { let d = root; for (const p of parts) d = await d.getDirectoryHandle(p, { create: true }); return d; }
async function writeFile(dir, name, blob) { const fh = await dir.getFileHandle(name, { create: true }); const w = await fh.createWritable(); await w.write(blob); await w.close(); }

async function fetchDocs(job) {
  // Renvoie [{name, blob}] : CV PDF + LM/Salaire/Guide en .md (légers). 'co' = préfixe.
  const co = safeName(job.entreprise);
  const out = [];
  try {
    const cv = await fetch(`/api/cv-pdf?job_id=${encodeURIComponent(job.job_id)}&variant=auto`, { cache: "no-store" });
    if (cv.ok) out.push({ name: `${co} - CV Jaona RABAONARISON.pdf`, blob: await cv.blob() });
  } catch (_) {}
  for (const [type, name] of [["lm", `${co} - CL Jaona RABAONARISON.md`], ["salaire", `${co} - Analyse salariale.md`], ["guide", `${co} - Guide entretien.md`]]) {
    try {
      const d = await (await fetch(`/api/doc?job_id=${encodeURIComponent(job.job_id)}&type=${type}&format=md`)).json();
      if (d && d.content) out.push({ name, blob: new Blob([d.content], { type: "text/markdown" }) });
    } catch (_) {}
  }
  return out;
}

async function downloadDossier(job, btn) {
  const old = btn.textContent; btn.textContent = "⏳…"; btn.disabled = true;
  try {
    const files = await fetchDocs(job);
    if (!files.length) { toast("Aucun document à télécharger", true); return; }
    if (FS_OK) {
      let root;
      try { root = await getRoot(); }
      catch (e) { toast("Dossier non autorisé — téléchargement classique", true); await fallback(job, files); return; }
      const dir = await ensureDir(root, [monthFolder(), safeName(job.entreprise), safeName(job.poste)]);
      for (const f of files) await writeFile(dir, f.name, f.blob);
      toast(`Dossier écrit → ${monthFolder()}/${safeName(job.entreprise)}/${safeName(job.poste)} (${files.length})`);
    } else {
      await fallback(job, files);
    }
  } catch (e) {
    toast("Échec : " + (e.message || e), true);
  } finally {
    btn.textContent = old; btn.disabled = false;
  }
}

// Repli (navigateur sans File System Access) : téléchargements classiques, préfixés.
async function fallback(job, files) {
  const prefix = `${monthFolder()} ${safeName(job.entreprise)} ${safeName(job.poste)} - `;
  for (const f of files) {
    const u = URL.createObjectURL(f.blob);
    const a = document.createElement("a"); a.href = u; a.download = prefix + f.name.replace(/^.* - /, ""); a.click();
    setTimeout(() => URL.revokeObjectURL(u), 60000);
    await new Promise(r => setTimeout(r, 300));
  }
  toast("Téléchargé dans Téléchargements (navigateur sans accès dossier)");
}

document.addEventListener("click", (e) => {
  const dl = e.target.closest("[data-dl]");
  if (dl) { const j = jobs.find(x => x.job_id === dl.dataset.dl); if (j) downloadDossier(j, dl); }
});
document.getElementById("search").addEventListener("input", e => { q = e.target.value; render(); });

document.getElementById("fsnote").textContent = FS_OK
  ? "💡 Au 1er « ⬇ Dossier », choisis ton dossier Focus FindJob une fois — ensuite tout y est rangé par mois automatiquement."
  : "ℹ️ Ce navigateur ne peut pas écrire dans un dossier : les docs iront dans Téléchargements (range-les ensuite).";

load();
if ("serviceWorker" in navigator) {
  let r = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (r) return; r = true; location.reload(); });
  navigator.serviceWorker.register("/sw.js").then(x => x.update && x.update()).catch(() => {});
}
</script>
</body>
</html>
